name: Structural report (heuristic bots)

# Stage 1.5. Heuristic bots through the unmodified referee — deterministic,
# fast, and free. No API key is used or needed by this workflow.

on:
  workflow_dispatch:
    inputs:
      games:
        description: "Number of games to simulate (1–200000). 5000 takes ~10s; 200000 a few minutes."
        required: true
        default: "5000"
        type: number
      archetype_overrides:
        description: 'Optional JSON overriding archetype parameters for this run only, e.g. {"A03":{"trust":0.8}}. Build it on the dashboard''s Parameters page. Blank = the committed archetypes.json.'
        required: false
        default: ""
        type: string

permissions:
  contents: write

# Both report workflows commit to main. Serialise them so two runs can't
# race on the same push. Never cancel: a run that has already spent time
# (or money, in the reasoning workflow's case) must be allowed to finish.
concurrency:
  group: lodge-reports
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Inputs are read from env, never interpolated into the script body.
      - name: Validate input
        id: cfg
        env:
          GAMES_INPUT: ${{ inputs.games }}
        run: |
          case "$GAMES_INPUT" in
            ''|*[!0-9]*) echo "::error::games must be a whole number, got '$GAMES_INPUT'"; exit 1 ;;
          esac
          games=$(python3 -c 'import sys; print(min(max(int(sys.argv[1]), 1), 200000))' "$GAMES_INPUT")
          if [ "$games" != "$GAMES_INPUT" ]; then
            echo "::warning::games clamped from $GAMES_INPUT to $games"
          fi
          echo "games=$games" >> "$GITHUB_OUTPUT"

      # Written to RUNNER_TEMP, deliberately outside the checkout: the override
      # applies to this run and cannot end up in the commit. archetypes.py does
      # the real validation (unknown id, unknown parameter, out of range) and
      # raises rather than silently ignoring a typo — this step only checks it
      # is JSON at all, so a malformed paste fails before the harness starts.
      - name: Stage archetype overrides
        env:
          OVERRIDES_INPUT: ${{ inputs.archetype_overrides }}
        run: |
          if [ -z "$(printf '%s' "$OVERRIDES_INPUT" | tr -d '[:space:]')" ]; then
            echo "no overrides — running on the committed archetypes.json"
            exit 0
          fi
          target="$RUNNER_TEMP/archetype_overrides.json"
          printf '%s' "$OVERRIDES_INPUT" > "$target"
          if ! python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$target"; then
            echo "::error::archetype_overrides is not valid JSON"
            exit 1
          fi
          echo "LODGE_ARCHETYPE_OVERRIDES=$target" >> "$GITHUB_ENV"
          echo "overrides staged:"
          cat "$target"

      # continue-on-error so the report still gets committed when the harness
      # exits non-zero on an invariant violation — that report is exactly the
      # one worth keeping. The run is failed at the end instead.
      - name: Run structural harness
        id: harness
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/run_structural_ci.py --games "${{ steps.cfg.outputs.games }}" 2>&1 | tee run.log

      - name: Rebuild dashboard
        run: python3 scripts/make_index.py

      - name: Commit results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Structural report: ${{ steps.cfg.outputs.games }} games (run ${{ github.run_number }})" \
                     -m "Generated by .github/workflows/structural.yml"
          for delay in 2 4 8 16 0; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            [ "$delay" = 0 ] && break
            echo "push failed, retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::could not push results to main"
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Structural report — ${{ steps.cfg.outputs.games }} games"
            echo
            echo '```'
            cat run.log 2>/dev/null || echo "(harness produced no output)"
            echo '```'
            echo
            echo "Published index: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if invariants broke
        if: steps.harness.outcome == 'failure'
        run: |
          echo "::error::the harness exited non-zero — see the invariant check in the report"
          exit 1

  publish:
    needs: report
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
